name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0A0D12&color_dots=#ebedf0,#b9f5d8,#7ef0bd,#3ddc97,#1fa971
            dist/snake-dark.svg?palette=github-dark&color_snake=#3DFFA8&color_dots=#161b22,#123d2c,#1a6b4a,#25a06c,#3DFFA8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
