  <text x="100" y="285.5" class="mono" font-size="12.5" fill="#E6EDF3">Now: Software Engineer at BTG · Stripe billing systems</text>
</g>
<text class="mono rise" style="animation-delay:0.75s" x="64" y="340" font-size="12.5" fill="#8B98A9" xml:space="preserve">Dallas, TX   ·   M.S. CS 2026   ·   Open to relocate</text>

