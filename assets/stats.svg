<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
<title id="t">25% latency cut in production, 10+ systems shipped, 200+ LeetCode problems solved, 4 cloud and AI certifications</title>
<defs><clipPath id="card"><rect width="1200" height="150" rx="16"/></clipPath><style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style></defs>
<g clip-path="url(#card)"><rect width="1200" height="150" fill="#0A0D12"/></g>
<rect x=".5" y=".5" width="1199" height="149" rx="15.5" fill="none" stroke="#1E2733"/>

    
    <g class="rise" style="animation-delay:0.1s">
      <text x="56" y="78" class="sans" font-size="46" font-weight="700" fill="#FFB547" letter-spacing="-1">25%</text>
      <text x="56" y="104" class="mono" font-size="11.5" fill="#8B98A9" letter-spacing="1.5">LATENCY CUT IN PROD</text>
    </g>
    <line x1="56" y1="120" x2="256" y2="120" stroke="#1E2733" stroke-width="2"/>
    <line x1="56" y1="120" x2="256" y2="120" pathLength="1" class="draw" style="animation-delay:0.5s" stroke="#FFB547" stroke-width="2"/>
    <line x1="312" y1="36" x2="312" y2="114" stroke="#1E2733"/>
    <g class="rise" style="animation-delay:0.22s">
      <text x="340" y="78" class="sans" font-size="46" font-weight="700" fill="#3DFFA8" letter-spacing="-1">10+</text>
      <text x="340" y="104" class="mono" font-size="11.5" fill="#8B98A9" letter-spacing="1.5">SYSTEMS SHIPPED</text>
    </g>
    <line x1="340" y1="120" x2="540" y2="120" stroke="#1E2733" stroke-width="2"/>
    <line x1="340" y1="120" x2="540" y2="120" pathLength="1" class="draw" style="animation-delay:0.65s" stroke="#3DFFA8" stroke-width="2"/>
    <line x1="596" y1="36" x2="596" y2="114" stroke="#1E2733"/>
    <g class="rise" style="animation-delay:0.33999999999999997s">
      <text x="624" y="78" class="sans" font-size="46" font-weight="700" fill="#3DFFA8" letter-spacing="-1">200+</text>
      <text x="624" y="104" class="mono" font-size="11.5" fill="#8B98A9" letter-spacing="1.5">LEETCODE SOLVED</text>
    </g>
    <line x1="624" y1="120" x2="824" y2="120" stroke="#1E2733" stroke-width="2"/>
    <line x1="624" y1="120" x2="824" y2="120" pathLength="1" class="draw" style="animation-delay:0.8s" stroke="#3DFFA8" stroke-width="2"/>
    <line x1="880" y1="36" x2="880" y2="114" stroke="#1E2733"/>
    <g class="rise" style="animation-delay:0.45999999999999996s">
      <text x="908" y="78" class="sans" font-size="46" font-weight="700" fill="#3DFFA8" letter-spacing="-1">4</text>
      <text x="908" y="104" class="mono" font-size="11.5" fill="#8B98A9" letter-spacing="1.5">CLOUD + AI CERTS</text>
    </g>
    <line x1="908" y1="120" x2="1108" y2="120" stroke="#1E2733" stroke-width="2"/>
    <line x1="908" y1="120" x2="1108" y2="120" pathLength="1" class="draw" style="animation-delay:0.95s" stroke="#3DFFA8" stroke-width="2"/>
</svg>
