<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="t d">
<title id="t">FactoryFlow AI</title>
<desc id="d">Diagram: an alarm goes to a confidence check. High confidence takes the fast path using a validated prior fix; low confidence retrieves incidents and searches before diagnosis.</desc>
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#FFB547" stop-opacity=".12"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#FFB547" stop-opacity="0"/><stop offset=".85" stop-color="#FFB547"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="600" height="320" rx="16"/></clipPath>
  <style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}
.sweep{animation-duration:3.2s}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style>
</defs>
<g clip-path="url(#card)">
  <rect width="600" height="320" fill="#0A0D12"/>
  <rect width="600" height="320" fill="url(#glow)"/>
  <rect width="600" height="2" fill="#FFB547" opacity=".3"/>
  <rect class="sweep motion" width="160" height="2" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="599" height="319" rx="15.5" fill="none" stroke="#1E2733"/>

<text class="mono rise" x="32" y="44" font-size="11" fill="#FFB547" letter-spacing="1.5">AI AGENTS · JUN 2026</text>
<g class="rise">
  <circle cx="524" cy="40" r="3.5" fill="#3DFFA8"/>
  <circle class="ping" cx="524" cy="40" r="3.5" fill="#3DFFA8"/>
  <text x="568" y="44" text-anchor="end" class="mono" font-size="11" fill="#B5C0CE" letter-spacing="1.5">LIVE</text>
</g>
<text class="sans rise" style="animation-delay:0.1s" x="32" y="92" font-size="30" font-weight="700" fill="#E6EDF3" letter-spacing="-.5">FactoryFlow AI</text>
<text class="sans rise" style="animation-delay:0.2s" x="32" y="124" font-size="15" fill="#B5C0CE">Manufacturing copilot. A LangGraph agent routes machine</text>
<text class="sans rise" style="animation-delay:0.25s" x="32" y="146" font-size="15" fill="#B5C0CE">alarms by confidence, then streams the diagnosis live.</text>
<g class="rise" style="animation-delay:0.35s">
    <path d="M74 211 H186 C206 211 206 186 226 186 H376 C404 186 404 211 500 211" pathLength="1" class="draw" style="animation-delay:0.4s" fill="none" stroke="#2A3543" stroke-width="1.5"/><path d="M74 211 H186 C206 211 206 236 226 236 H376 C404 236 404 211 500 211" pathLength="1" class="draw" style="animation-delay:0.6s" fill="none" stroke="#2A3543" stroke-width="1.5"/>
    
<g class="motion" opacity="0">
  <set attributeName="opacity" to="1" begin="0.8s"/>
  <circle r="7.5" fill="#3DFFA8" opacity=".18"/>
  <circle r="3.5" fill="#3DFFA8"/>
  <animateMotion dur="1.9s" begin="0.8s" repeatCount="indefinite" path="M74 211 H186 C206 211 206 186 226 186 H376 C404 186 404 211 500 211"/>
</g>
    
<g class="motion" opacity="0">
  <set attributeName="opacity" to="1" begin="1.6s"/>
  <circle r="7.5" fill="#5CC8FF" opacity=".18"/>
  <circle r="3.5" fill="#5CC8FF"/>
  <animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite" path="M74 211 H186 C206 211 206 236 226 236 H376 C404 236 404 211 500 211"/>
</g>
    
<g>
  <rect x="32" y="193" width="84" height="36" rx="8" fill="#10151D" stroke="#1E2733"/>
  <text x="43" y="208" class="mono" font-size="11.5" fill="#E6EDF3">alarm</text>
  <text x="43" y="222" class="mono" font-size="9.5" fill="#8B98A9">machine m-07</text>
</g>
    <rect x="160" y="201" width="20" height="20" rx="3" transform="rotate(45 170 211)" fill="#10151D" stroke="#FFB547"/>
    <text x="170" y="250" text-anchor="middle" class="mono" font-size="9.5" fill="#8B98A9">conf?</text>
    
<g>
  <rect x="226" y="168" width="150" height="36" rx="8" fill="#10151D" stroke="#3DFFA8"/>
  <text x="237" y="183" class="mono" font-size="11.5" fill="#E6EDF3">fast path</text>
  <text x="237" y="197" class="mono" font-size="9.5" fill="#8B98A9">validated prior fix</text>
</g>
    
<g>
  <rect x="226" y="218" width="150" height="36" rx="8" fill="#10151D" stroke="#1E2733"/>
  <text x="237" y="233" class="mono" font-size="11.5" fill="#E6EDF3">retrieve → search</text>
  <text x="237" y="247" class="mono" font-size="9.5" fill="#8B98A9">incidents · tavily</text>
</g>
    
<g>
  <rect x="432" y="193" width="136" height="36" rx="8" fill="#10151D" stroke="#FFB547"/>
  <text x="443" y="208" class="mono" font-size="11.5" fill="#E6EDF3">diagnosis</text>
  <text x="443" y="222" class="mono" font-size="9.5" fill="#8B98A9">streamed via SSE</text>
</g></g>
<g class="rise" style="animation-delay:0.55s"><rect x="32" y="272" width="94" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="79" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Spring Boot</text></g><g class="rise" style="animation-delay:0.61s"><rect x="134" y="272" width="67" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="167.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">FastAPI</text></g><g class="rise" style="animation-delay:0.67s"><rect x="209" y="272" width="80" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="249" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">LangGraph</text></g><g class="rise" style="animation-delay:0.73s"><rect x="297" y="272" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="340.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">PostgreSQL</text></g><g class="rise" style="animation-delay:0.79s"><rect x="392" y="272" width="40" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="412" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">SSE</text></g><g class="rise" style="animation-delay:0.85s"><rect x="440" y="272" width="40" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="460" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">AWS</text></g>
</svg>
