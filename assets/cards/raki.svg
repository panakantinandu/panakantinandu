<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="t d">
<title id="t">Raki</title>
<desc id="d">Diagram: an invoice document is scanned, sent to the Claude API for field extraction, and the GSTIN, amount and due date are filled in.</desc>
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#FFB547" stop-opacity=".12"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#FFB547" stop-opacity="0"/><stop offset=".85" stop-color="#FFB547"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="600" height="320" rx="16"/></clipPath>
  <style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}
.sweep{animation-duration:3.2s}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style>
</defs>
<g clip-path="url(#card)">
  <rect width="600" height="320" fill="#0A0D12"/>
  <rect width="600" height="320" fill="url(#glow)"/>
  <rect width="600" height="2" fill="#FFB547" opacity=".3"/>
  <rect class="sweep motion" width="160" height="2" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="599" height="319" rx="15.5" fill="none" stroke="#1E2733"/>

<text class="mono rise" x="32" y="44" font-size="11" fill="#FFB547" letter-spacing="1.5">AI SAAS · JUL 2026</text>
<g class="rise">
  <circle cx="524" cy="40" r="3.5" fill="#3DFFA8"/>
  <circle class="ping" cx="524" cy="40" r="3.5" fill="#3DFFA8"/>
  <text x="568" y="44" text-anchor="end" class="mono" font-size="11" fill="#B5C0CE" letter-spacing="1.5">LIVE</text>
</g>
<text class="sans rise" style="animation-delay:0.1s" x="32" y="92" font-size="30" font-weight="700" fill="#E6EDF3" letter-spacing="-.5">Raki</text>
<text class="sans rise" style="animation-delay:0.2s" x="32" y="124" font-size="15" fill="#B5C0CE">Practice management for CA firms. Claude extracts</text>
<text class="sans rise" style="animation-delay:0.25s" x="32" y="146" font-size="15" fill="#B5C0CE">invoice fields, so GST, ITR and TDS deadlines track themselves.</text>
<g class="rise" style="animation-delay:0.35s">
    <path d="M32 168 H88 L102 182 V254 H32 Z" fill="#10151D" stroke="#1E2733"/>
    <path d="M88 168 V182 H102" fill="none" stroke="#1E2733"/>
    <text x="42" y="186" class="mono" font-size="9" fill="#8B98A9">INV</text>
    <rect x="42" y="196" width="46" height="4" rx="2" fill="#2A3543"/><rect x="42" y="207" width="38" height="4" rx="2" fill="#2A3543"/><rect x="42" y="218" width="50" height="4" rx="2" fill="#2A3543"/><rect x="42" y="229" width="32" height="4" rx="2" fill="#2A3543"/><rect x="42" y="240" width="44" height="4" rx="2" fill="#2A3543"/>
    <rect class="scan motion" x="34" y="172" width="66" height="2" fill="#FFB547"/>
    <style>.scan{animation:scan 3s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(78px)}}</style>
    <path d="M102 211 H140" pathLength="1" class="draw" style="animation-delay:0.4s" fill="none" stroke="#2A3543" stroke-width="1.5"/><path d="M252 211 H290" pathLength="1" class="draw" style="animation-delay:0.5s" fill="none" stroke="#2A3543" stroke-width="1.5"/>
    
<g class="motion" opacity="0">
  <set attributeName="opacity" to="1" begin="0.9s"/>
  <circle r="7.5" fill="#FFB547" opacity=".18"/>
  <circle r="3.5" fill="#FFB547"/>
  <animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite" path="M102 211 H290"/>
</g>
    
<g>
  <rect x="140" y="193" width="112" height="36" rx="8" fill="#10151D" stroke="#FFB547"/>
  <text x="151" y="208" class="mono" font-size="11.5" fill="#E6EDF3">claude api</text>
  <text x="151" y="222" class="mono" font-size="9.5" fill="#8B98A9">field extraction</text>
</g>
    <rect x="290" y="168" width="278" height="86" rx="8" fill="#10151D" stroke="#1E2733"/>
    <text x="304" y="186" class="mono" font-size="9.5" fill="#8B98A9" letter-spacing="1">EXTRACTED · GSTR-3B</text>
    <text class="row mono" x="304" y="206" font-size="10.5" fill="#B5C0CE" xml:space="preserve">gstin    27AAPFU0939F1ZV</text>
    <text class="row mono" style="animation-delay:0.5s" x="304" y="224" font-size="10.5" fill="#B5C0CE" xml:space="preserve">amount   INR 48,260.00</text>
    <text class="row mono" style="animation-delay:1s" x="304" y="242" font-size="10.5" fill="#FFB547" xml:space="preserve">due      20 Nov · filing queued</text></g>
<g class="rise" style="animation-delay:0.55s"><rect x="32" y="272" width="121" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="92.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Spring Security</text></g><g class="rise" style="animation-delay:0.61s"><rect x="161" y="272" width="60" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="191" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">OAuth2</text></g><g class="rise" style="animation-delay:0.67s"><rect x="229" y="272" width="54" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="256" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Redis</text></g><g class="rise" style="animation-delay:0.73s"><rect x="291" y="272" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="334.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Claude API</text></g><g class="rise" style="animation-delay:0.79s"><rect x="386" y="272" width="60" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="416" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Docker</text></g><g class="rise" style="animation-delay:0.85s"><rect x="454" y="272" width="54" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="481" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">React</text></g>
</svg>
