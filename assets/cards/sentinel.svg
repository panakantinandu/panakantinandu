<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="t d">
<title id="t">MCPSentinel</title>
<desc id="d">Diagram: requests pass through four gates (schema, authz, pii, failover). An unauthorized request is stopped at authz with a 403.</desc>
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#3DFFA8" stop-opacity=".12"/><stop offset="1" stop-color="#3DFFA8" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#3DFFA8" stop-opacity="0"/><stop offset=".85" stop-color="#3DFFA8"/><stop offset="1" stop-color="#3DFFA8" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="600" height="320" rx="16"/></clipPath>
  <style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}
.sweep{animation-duration:3.2s}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style>
</defs>
<g clip-path="url(#card)">
  <rect width="600" height="320" fill="#0A0D12"/>
  <rect width="600" height="320" fill="url(#glow)"/>
  <rect width="600" height="2" fill="#3DFFA8" opacity=".3"/>
  <rect class="sweep motion" width="160" height="2" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="599" height="319" rx="15.5" fill="none" stroke="#1E2733"/>

<text class="mono rise" x="32" y="44" font-size="11" fill="#3DFFA8" letter-spacing="1.5">LLM INFRA · SEP 2026</text>
<g class="rise">
  <circle cx="524" cy="40" r="3.5" fill="#3DFFA8"/>
  <circle class="ping" cx="524" cy="40" r="3.5" fill="#3DFFA8"/>
  <text x="568" y="44" text-anchor="end" class="mono" font-size="11" fill="#B5C0CE" letter-spacing="1.5">LIVE</text>
</g>
<text class="sans rise" style="animation-delay:0.1s" x="32" y="92" font-size="30" font-weight="700" fill="#E6EDF3" letter-spacing="-.5">MCPSentinel</text>
<text class="sans rise" style="animation-delay:0.2s" x="32" y="124" font-size="15" fill="#B5C0CE">Four guardrail services for MCP and LLM traffic: schema,</text>
<text class="sans rise" style="animation-delay:0.25s" x="32" y="146" font-size="15" fill="#B5C0CE">tool authz, streaming PII redaction and upstream failover.</text>
<g class="rise" style="animation-delay:0.35s">
    <line x1="32" y1="211" x2="568" y2="211" stroke="#2A3543" stroke-width="1.5" stroke-dasharray="2 5"/>
    <text x="32" y="196" class="mono" font-size="10" fill="#8B98A9">mcp call</text>
    <text x="568" y="196" text-anchor="end" class="mono" font-size="10" fill="#8B98A9">upstream</text>
    
      <rect x="139" y="184" width="22" height="54" rx="6" fill="#3DFFA8" opacity=".08"/>
      <rect x="147" y="184" width="6" height="54" rx="3" fill="#3DFFA8" opacity=".9"/>
      <text x="150" y="254" text-anchor="middle" class="mono" font-size="10" fill="#8B98A9">schema</text>
      <rect x="251" y="184" width="22" height="54" rx="6" fill="#3DFFA8" opacity=".08"/>
      <rect x="259" y="184" width="6" height="54" rx="3" fill="#3DFFA8" opacity=".9"/>
      <text x="262" y="254" text-anchor="middle" class="mono" font-size="10" fill="#8B98A9">authz</text>
      <rect x="363" y="184" width="22" height="54" rx="6" fill="#3DFFA8" opacity=".08"/>
      <rect x="371" y="184" width="6" height="54" rx="3" fill="#3DFFA8" opacity=".9"/>
      <text x="374" y="254" text-anchor="middle" class="mono" font-size="10" fill="#8B98A9">pii</text>
      <rect x="475" y="184" width="22" height="54" rx="6" fill="#3DFFA8" opacity=".08"/>
      <rect x="483" y="184" width="6" height="54" rx="3" fill="#3DFFA8" opacity=".9"/>
      <text x="486" y="254" text-anchor="middle" class="mono" font-size="10" fill="#8B98A9">failover</text>
    
<g class="motion" opacity="0">
  <set attributeName="opacity" to="1" begin="0.6s"/>
  <circle r="7.5" fill="#3DFFA8" opacity=".18"/>
  <circle r="3.5" fill="#3DFFA8"/>
  <animateMotion dur="3.6s" begin="0.6s" repeatCount="indefinite" path="M32 211 H568"/>
</g>
    <g class="motion" opacity="0">
      <circle r="7.5" fill="#FF6B6B" opacity=".2"/><circle r="3.5" fill="#FF6B6B"/>
      <animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" path="M32 211 H252" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="3.6s" begin="2.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.85;1"/>
    </g>
    <text class="motion mono" x="262" y="176" text-anchor="middle" font-size="10.5" fill="#FF6B6B" opacity="0">403 denied
      <animate attributeName="opacity" dur="3.6s" begin="2.4s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.45;.5;.85;1"/>
    </text>
    <text x="374" y="176" text-anchor="middle" class="mono" font-size="10.5" fill="#5CC8FF">[redacted]</text></g>
<g class="rise" style="animation-delay:0.55s"><rect x="32" y="272" width="60" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="62" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Python</text></g><g class="rise" style="animation-delay:0.61s"><rect x="100" y="272" width="40" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="120" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">MCP</text></g><g class="rise" style="animation-delay:0.67s"><rect x="148" y="272" width="47" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="171.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">RBAC</text></g><g class="rise" style="animation-delay:0.73s"><rect x="203" y="272" width="107" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="256.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">PII redaction</text></g><g class="rise" style="animation-delay:0.79s"><rect x="318" y="272" width="74" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="355" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Failover</text></g><g class="rise" style="animation-delay:0.85s"><rect x="400" y="272" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="443.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">TypeScript</text></g>
</svg>
