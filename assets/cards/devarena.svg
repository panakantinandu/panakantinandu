<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="t d">
<title id="t">DevArena</title>
<desc id="d">Illustration of a live quiz battle between you and a peer with a countdown timer. Scoring is server-side over WebSocket.</desc>
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#5CC8FF" stop-opacity=".12"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#5CC8FF" stop-opacity="0"/><stop offset=".85" stop-color="#5CC8FF"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="600" height="320" rx="16"/></clipPath>
  <style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}
.sweep{animation-duration:3.2s}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style>
</defs>
<g clip-path="url(#card)">
  <rect width="600" height="320" fill="#0A0D12"/>
  <rect width="600" height="320" fill="url(#glow)"/>
  <rect width="600" height="2" fill="#5CC8FF" opacity=".3"/>
  <rect class="sweep motion" width="160" height="2" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="599" height="319" rx="15.5" fill="none" stroke="#1E2733"/>

<text class="mono rise" x="32" y="44" font-size="11" fill="#5CC8FF" letter-spacing="1.5">REALTIME · OCT 2026</text>
<g class="rise">
  <circle cx="507" cy="40" r="3.5" fill="#8B98A9"/>
  
  <text x="568" y="44" text-anchor="end" class="mono" font-size="11" fill="#B5C0CE" letter-spacing="1.5">SOURCE</text>
</g>
<text class="sans rise" style="animation-delay:0.1s" x="32" y="92" font-size="30" font-weight="700" fill="#E6EDF3" letter-spacing="-.5">DevArena</text>
<text class="sans rise" style="animation-delay:0.2s" x="32" y="124" font-size="15" fill="#B5C0CE">Multiplayer interview prep: live quiz battles, peer</text>
<text class="sans rise" style="animation-delay:0.25s" x="32" y="146" font-size="15" fill="#B5C0CE">mock interviews, and a 90-day mission planner.</text>
<g class="rise" style="animation-delay:0.35s">
    <text x="32" y="186" class="mono" font-size="11" fill="#E6EDF3">you</text>
    <text x="232" y="186" text-anchor="end" class="mono" font-size="10" fill="#8B98A9">q 07/10</text>
    <rect x="32" y="196" width="200" height="8" rx="4" fill="#10151D" stroke="#1E2733"/>
    <rect class="grow" x="32" y="196" width="172" height="8" rx="4" fill="#5CC8FF"/>
    <text x="368" y="186" class="mono" font-size="11" fill="#E6EDF3">peer</text>
    <text x="568" y="186" text-anchor="end" class="mono" font-size="10" fill="#8B98A9">q 06/10</text>
    <rect x="368" y="196" width="200" height="8" rx="4" fill="#10151D" stroke="#1E2733"/>
    <rect class="grow" x="368" y="196" width="140" height="8" rx="4" fill="#FFB547" style="animation-duration:6.6s"/>
    <circle cx="300" cy="211" r="28" fill="#10151D" stroke="#1E2733" stroke-width="4"/>
    <circle class="countdown" cx="300" cy="211" r="28" fill="none" stroke="#5CC8FF" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" transform="rotate(-90 300 211)"/>
    <style>.countdown{animation:countdown 6s linear infinite}@keyframes countdown{from{stroke-dashoffset:0}to{stroke-dashoffset:1}}</style>
    <text x="300" y="216" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">VS</text>
    <text x="32" y="228" class="mono" font-size="10" fill="#8B98A9">scored server-side</text>
    <text x="568" y="228" text-anchor="end" class="mono" font-size="10" fill="#8B98A9">websocket · per-battle lock</text></g>
<g class="rise" style="animation-delay:0.55s"><rect x="32" y="272" width="67" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="65.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Java 21</text></g><g class="rise" style="animation-delay:0.61s"><rect x="107" y="272" width="94" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="154" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Spring Boot</text></g><g class="rise" style="animation-delay:0.67s"><rect x="209" y="272" width="80" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="249" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">WebSocket</text></g><g class="rise" style="animation-delay:0.73s"><rect x="297" y="272" width="74" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="334" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">React 19</text></g><g class="rise" style="animation-delay:0.79s"><rect x="379" y="272" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="422.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">PostgreSQL</text></g><g class="rise" style="animation-delay:0.85s"><rect x="474" y="272" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="517.5" y="288" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Playwright</text></g>
</svg>
