<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">SheOut: women-only bike taxi, parcel delivery and marketplace</title>
<desc id="d">Launched product in Hyderabad. A map shows a verified woman partner riding the route from pickup to drop, with a pickup code, live trip sharing and an SOS button.</desc>
<defs>
  <radialGradient id="glow" cx="100%" cy="0%" r="60%"><stop offset="0" stop-color="#FFB547" stop-opacity=".12"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#FFB547" stop-opacity="0"/><stop offset=".85" stop-color="#FFB547"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  <clipPath id="map"><rect x="650" y="72" width="510" height="240" rx="12"/></clipPath>
  <style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}
.sweep{animation-duration:4.4s}
.dash{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="340" fill="#0A0D12"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="2" fill="#FFB547" opacity=".3"/>
  <rect class="sweep motion" width="160" height="2" fill="url(#sw)"/>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="17.5" fill="none" stroke="#1E2733"/>

<text class="mono rise" x="40" y="52" font-size="11" fill="#FFB547" letter-spacing="1.5">FLAGSHIP · LAUNCHED IN HYDERABAD · 2026</text>
<text class="sans rise" style="animation-delay:0.1s" x="38" y="112" font-size="44" font-weight="700" fill="#E6EDF3" letter-spacing="-1">SheOut</text>
<text class="sans rise" style="animation-delay:0.2s" x="40" y="148" font-size="16" fill="#B5C0CE">Women-only bike taxi, parcel delivery and marketplace.</text>
<text class="sans rise" style="animation-delay:0.25s" x="40" y="172" font-size="16" fill="#B5C0CE">Verified partners, pickup codes, live trip sharing and SOS on</text>
<text class="sans rise" style="animation-delay:0.3s" x="40" y="196" font-size="16" fill="#B5C0CE">every ride, in English, Hindi and Telugu.</text>
<text class="mono rise" style="animation-delay:0.4s" x="40" y="246" font-size="11" fill="#8B98A9" letter-spacing=".5">modular monolith · domain events · geo dispatch · two-person approvals</text>
<g class="rise" style="animation-delay:0.55s"><rect x="40" y="284" width="67" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="73.5" y="300" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Java 21</text></g><g class="rise" style="animation-delay:0.61s"><rect x="115" y="284" width="107" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="168.5" y="300" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Spring Boot 3</text></g><g class="rise" style="animation-delay:0.67s"><rect x="230" y="284" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="273.5" y="300" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">React PWAs</text></g><g class="rise" style="animation-delay:0.73s"><rect x="325" y="284" width="87" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="368.5" y="300" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">PostgreSQL</text></g><g class="rise" style="animation-delay:0.79s"><rect x="420" y="284" width="80" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="460" y="300" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Redis geo</text></g><g class="rise" style="animation-delay:0.85s"><rect x="508" y="284" width="74" height="24" rx="12" fill="#10151D" stroke="#1E2733"/><text x="545" y="300" text-anchor="middle" class="mono" font-size="11" fill="#B5C0CE">Razorpay</text></g>

<!-- map -->
<g class="rise" style="animation-delay:0.3s">
  <rect x="650" y="72" width="510" height="240" rx="12" fill="#10151D" stroke="#1E2733"/>
  <g clip-path="url(#map)">
    <path d="M650 140 H1160" stroke="#18212C" stroke-width="6" fill="none"/><path d="M650 230 H1160" stroke="#18212C" stroke-width="6" fill="none"/><path d="M650 290 H1160" stroke="#18212C" stroke-width="6" fill="none"/><path d="M720 72 V312" stroke="#18212C" stroke-width="6" fill="none"/><path d="M840 72 V312" stroke="#18212C" stroke-width="6" fill="none"/><path d="M960 72 V312" stroke="#18212C" stroke-width="6" fill="none"/><path d="M1080 72 V312" stroke="#18212C" stroke-width="6" fill="none"/><path d="M650 300 L860 72" stroke="#18212C" stroke-width="6" fill="none"/><path d="M900 312 L1160 120" stroke="#18212C" stroke-width="6" fill="none"/>
    <path d="M700 268 C780 268 790 196 870 200 S1010 236 1050 170 S1090 112 1112 112" fill="none" stroke="#FFB547" stroke-opacity=".25" stroke-width="8" stroke-linecap="round"/>
    <path class="dash" d="M700 268 C780 268 790 196 870 200 S1010 236 1050 170 S1090 112 1112 112" fill="none" stroke="#FFB547" stroke-width="2.5" stroke-linecap="round"/>
    
<g class="motion" opacity="0">
  <set attributeName="opacity" to="1" begin="0.6s"/>
  <circle r="9" fill="#E6EDF3" opacity=".18"/>
  <circle r="5" fill="#E6EDF3"/>
  <animateMotion dur="6s" begin="0.6s" repeatCount="indefinite" path="M700 268 C780 268 790 196 870 200 S1010 236 1050 170 S1090 112 1112 112"/>
</g>
  </g>
  <circle cx="700" cy="268" r="7" fill="#3DFFA8"/><circle class="ping" cx="700" cy="268" r="7" fill="#3DFFA8"/>
  <text x="714" y="290" class="mono" font-size="10" fill="#B5C0CE">pickup</text>
  <path d="M1112 112 m0 -18 a9 9 0 0 1 9 9 c0 7 -9 15 -9 15 s-9 -8 -9 -15 a9 9 0 0 1 9 -9z" fill="#FFB547"/>
  <text x="1126" y="116" class="mono" font-size="10" fill="#B5C0CE">drop</text>

  <rect x="664" y="86" width="196" height="30" rx="8" fill="#0A0D12" stroke="#1E2733"/>
  <text x="676" y="105" class="mono" font-size="10.5" fill="#8B98A9" xml:space="preserve">PICKUP CODE  <tspan fill="#E6EDF3" font-weight="700">4  8  2  7</tspan></text>

  <rect x="664" y="124" width="150" height="26" rx="8" fill="#0A0D12" stroke="#1E2733"/>
  <circle cx="678" cy="137" r="3.5" fill="#3DFFA8"/>
  <text x="688" y="141" class="mono" font-size="10.5" fill="#B5C0CE">partner verified</text>

  <rect x="1010" y="270" width="76" height="28" rx="14" fill="#0A0D12" stroke="#1E2733"/>
  <circle cx="1024" cy="284" r="3.5" fill="#5CC8FF"/><circle class="ping" cx="1024" cy="284" r="3.5" fill="#5CC8FF"/>
  <text x="1034" y="288" class="mono" font-size="10.5" fill="#B5C0CE">live</text>
  <rect x="1094" y="270" width="52" height="28" rx="14" fill="#FF6B6B"/>
  <text x="1120" y="288.5" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#0A0D12">SOS</text>
</g>
</svg>
