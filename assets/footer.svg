<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t">
<title id="t">Let's build systems that don't page you at 2 AM. Reach out using the links below.</title>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1E2733"/></pattern>
  <clipPath id="card"><rect width="1200" height="240" rx="20"/></clipPath>
  <style>
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.draw{stroke-dasharray:1;animation:draw 1.4s ease backwards}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sweep{animation:sweep 3.6s linear infinite}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
.row{animation:row 5s ease infinite}
@keyframes row{0%,8%{opacity:0;transform:translateX(-6px)}18%,86%{opacity:1;transform:none}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.04)}70%,100%{transform:scaleX(1)}}
.trace{stroke-dasharray:.18 .82;animation:trace 4s linear infinite}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}
</style>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="240" fill="#0A0D12"/>
  <rect width="1200" height="240" fill="url(#dots)"/>
</g>
<rect x=".5" y=".5" width="1199" height="239" rx="19.5" fill="none" stroke="#1E2733"/>
<g class="rise">
  <text x="64" y="62" class="mono" font-size="13" fill="#8B98A9">nandu@systems:~$ <tspan fill="#3DFFA8">./connect.sh </tspan><tspan class="blink" fill="#3DFFA8">█</tspan></text>
</g>
<text class="sans rise" style="animation-delay:0.15s" x="62" y="112" font-size="34" font-weight="700" fill="#E6EDF3" letter-spacing="-.6">Let's build systems that don't page you at 2 AM.</text>
<text class="sans rise" style="animation-delay:0.3s" x="64" y="142" font-size="15" fill="#B5C0CE">Backend · Distributed systems · AI agents. The links below are the fastest way to reach me.</text>
<path d="M40 204 H330 l12 -8 l10 16 l12 -52 l12 68 l10 -24 H630 l12 -8 l10 16 l12 -52 l12 68 l10 -24 H930 l12 -8 l10 16 l12 -52 l12 68 l10 -24 H1160" fill="none" stroke="#2A3543" stroke-width="1.5" stroke-linejoin="round"/>
<path class="trace motion" d="M40 204 H330 l12 -8 l10 16 l12 -52 l12 68 l10 -24 H630 l12 -8 l10 16 l12 -52 l12 68 l10 -24 H930 l12 -8 l10 16 l12 -52 l12 68 l10 -24 H1160" pathLength="1" fill="none" stroke="#3DFFA8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
